services:
   # ============================================================
   # DATABASE
   # ============================================================
   postgres:
      image: pgvector/pgvector:pg16
      container_name: orchestrator-postgres
      restart: unless-stopped
      environment:
         POSTGRES_DB: orchestrator
         POSTGRES_USER: orchestrator
         POSTGRES_PASSWORD: changeme
      volumes:          
         - postgres_data:/var/lib/postgresql/data
      ports:
         - "15433:5432"
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
         interval: 10s
         timeout: 5s
         retries: 5

   # ============================================================
   # GO ORCHESTRATOR
   # ============================================================
   orchestrator:
      build: .
      container_name: orchestrator-api
      restart: unless-stopped
      stop_grace_period: 30s
      env_file:
         - .env
      environment:
         LLM_HOST: host.docker.internal
         DB_HOST: orchestrator-postgres
         DB_PORT: 5432
      ports:
         - "50000:50000"
      depends_on:
         postgres:
            condition: service_healthy
      extra_hosts:
         - "host.docker.internal:host-gateway"

   # ============================================================
   # CHAT UI
   # ============================================================
   open-webui:
      image: ghcr.io/open-webui/open-webui:main
      container_name: orchestrator-webui
      restart: unless-stopped
      depends_on:
         postgres:
            condition: service_healthy
      environment:
         OPENAI_API_BASE_URL: http://host.docker.internal:11434/v1
         OPENAI_API_KEY: ollama
      volumes:
         - webui_data:/app/backend/data
      ports:
         - "53000:8080"
      extra_hosts:
         - "host.docker.internal:host-gateway"

